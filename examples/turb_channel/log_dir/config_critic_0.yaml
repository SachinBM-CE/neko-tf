general:
  report_frequency: 1
  enable_wandb_hook: 1
  verbose: 1
algorithm:
  type: sac
  parameters:
    batch_size: 1
    nstep: 1
    nstep_reward_reduction: sum
    num_critics: 1
    gamma: 0.995
    rho: 0.99
    alpha: 0.1
actor:
  type: space_noise
  parameters:
    a_low: 0.9
    a_high: 1.1
replay_buffer:
  type: uniform
  parameters:
    max_size: 1166400
    min_size: 11664
    n_envs: 11664
policy_model:
  type: torchscript
  parameters:
    filename: policy.pt
critic_model:
  type: torchscript
  parameters:
    filename: value.pt
optimizer:
  type: adam
  parameters:
    learning_rate: 1e-6
    beta1: 0.9
    beta2: 0.999
    weight_decay: 0
    eps: 1e-6
    amsgrad: 0
policy_lr_scheduler:
  type: cosine_annealing
  parameters:
    T_max: 5000
critic_lr_scheduler:
  type: cosine_annealing
  parameters:
    T_max: 5000
identifier: critic_0